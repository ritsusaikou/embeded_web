# ============================================================
# 轻痕博客 · Nginx 站点配置（针对 512MB 小内存机优化）
# 用法：拷到服务器 /etc/nginx/sites-available/blog.conf
#       然后 ln -s 到 sites-enabled/ 并 nginx -s reload
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # 改成你自己的域名（或服务器 IP）
    server_name blog.example.com;

    # 构建产物目录（deploy.sh 会同步到这里）
    root /var/www/blog;
    index index.html;

    # 只服务静态文件：没有 PHP、没有反代、没有数据库
    charset utf-8;

    # ---------- 小内存机优化 ----------
    # 静态文件由 sendfile 直接在内核态发送，占用极低
    sendfile on;
    tcp_nopush on;

    # gzip 压缩（牺牲一点 CPU 换带宽）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;

    # ---------- 缓存策略 ----------
    # 带哈希指纹的静态资源缓存一年
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存（保证内容即时更新）
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # RSS 缓存 10 分钟
    location = /rss.xml {
        expires 10m;
    }

    # ---------- 安全 ----------
    # 不暴露版本号
    server_tokens off;

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 静态站没有动态请求，超时设短
    client_body_timeout 5s;
    client_header_timeout 5s;
}

# ============================================================
# 可选：HTTPS（强烈建议）
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d blog.example.com
# certbot 会自动改写本配置并设置证书续期
# ============================================================
