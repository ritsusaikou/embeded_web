# ============================================================
# i.MX6ULL 开发板 · Nginx 站点配置（方案 A）
# 部署路径：/etc/nginx/conf.d/site.conf
#
# 设计前提：
#   - 单核 Cortex-A7，512MB 内存，系统盘为 SD / eMMC
#   - 只提供静态文件，不做任何反向代理
#   - 板上 nginx 为 1.8.1（Yocto），构建时未带 IPv6 支持
# ============================================================

server {
    # 板上的 nginx 1.8.1 没编译 --with-ipv6，写 listen [::]:80 会报
    # "the INET6 sockets are not supported on this platform"，所以只监听 IPv4。
    listen 80 default_server;

    server_name _;

    root /var/www/site;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------- 零拷贝发送 ----------
    sendfile   on;
    tcp_nopush on;

    # ---------- 压缩策略 ----------
    # 关掉运行时压缩：A7 压一个 12KB 页面要几毫秒，纯属浪费 CPU。
    # 改为构建时预压缩（.gz 与源文件同级），Nginx 直接发同名 .gz。
    # 实测首页 27192B → 6739B。
    gzip off;
    gzip_static on;

    # ---------- 缓存 ----------
    # 带内容哈希的静态资源长期缓存（不再写 expires，避免出两个 Cache-Control）
    location /_astro/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # 状态文件不缓存
    location = /status.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # HTML 不缓存，改完立即生效
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    # 站点自己的 404 页面（方案 B 的 static_file 插件做不到这一点）
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # ---------- 小内存 / 少写盘 ----------
    # 关掉 access log，减少 SD 卡写放大（需要统计时临时打开）
    access_log off;

    client_body_timeout    5s;
    client_header_timeout  5s;
    keepalive_timeout      15s;
    send_timeout           10s;

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# 配套的 /etc/nginx/nginx.conf 必须包含 conf.d（Yocto 默认没有这一行，
# 不加的话本文件放进去也不生效，现象是 80 端口仍返回 nginx 默认页）：
#
#   user  www-data;
#   worker_processes  1;
#   error_log  /var/log/nginx/error.log warn;
#   pid        /run/nginx/nginx.pid;
#
#   events { worker_connections 512; }
#
#   http {
#       include       mime.types;
#       default_type  application/octet-stream;
#       sendfile      on;
#       tcp_nopush    on;
#       keepalive_timeout 15;
#
#       include /etc/nginx/conf.d/*.conf;
#   }
