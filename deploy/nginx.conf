# ============================================================
# i.MX6ULL 开发板 · Nginx 站点配置
# 部署路径：/etc/nginx/conf.d/site.conf
#
# 设计前提：
#   - 单核 Cortex-A7，528~792MHz
#   - 512MB 内存，系统盘为 SD / eMMC
#   - 只提供静态文件，不做任何反向代理
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/site;
    index index.html;

    charset utf-8;

    # ---------- 零拷贝发送 ----------
    sendfile   on;
    tcp_nopush on;

    # ---------- 压缩策略 ----------
    # 关掉运行时压缩：A7 压一个 12KB 页面要几毫秒，纯属浪费 CPU。
    # 改为构建时预压缩（deploy.sh 生成 .gz），Nginx 直接发同名 .gz。
    gzip off;
    gzip_static on;

    # ---------- 缓存 ----------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 状态文件不缓存
    location = /status.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # HTML 不缓存
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    # ---------- 小内存 / 少写盘 ----------
    # 关掉 access log，减少 SD 卡写放大（需要统计时临时打开）
    access_log off;

    client_body_timeout    5s;
    client_header_timeout  5s;
    keepalive_timeout      15s;
    send_timeout           10s;

    server_tokens off;

    location ~ /\.(?!well-known) {
        deny all;
    }
}
