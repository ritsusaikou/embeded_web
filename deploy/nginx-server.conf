# ============================================================
# 公网服务器（阿里云 Ubuntu）· board.nexuslink.icu 站点
# 部署路径：/etc/nginx/sites-available/board
#          软链到 /etc/nginx/sites-enabled/board
#
# 职责：
#   80  → ACME 验证 + 301 跳 https
#   443 → 解 TLS，反代到 frps 开出来的 127.0.0.1:8080（板子的 80）
#         其中 /agent/ws/ 要把 Upgrade 头透传给隧道，否则 WebSocket 握手不成功
# ============================================================

# ---------- 80：只做 ACME 验证和跳转 ----------
server {
    listen 80;
    server_name board.nexuslink.icu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

# ---------- 443：证书 + 反代到隧道 ----------
server {
    listen 443 ssl http2;
    server_name board.nexuslink.icu;

    ssl_certificate     /etc/letsencrypt/live/board.nexuslink.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board.nexuslink.icu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens       off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # ---------- WebSocket：远程 shell / 屏幕推流 ----------
    # 必须放在 location / 前面（前缀匹配按最长优先，这里显式写清更直观）。
    # 三个关键点：
    #   1. proxy_http_version 1.1 —— 1.0 不支持 Upgrade
    #   2. Upgrade / Connection 两个头逐层透传，服务器与板上 nginx 都要写
    #   3. proxy_read_timeout 拉长 + 关 buffering，否则空闲 30s 就被掐、画面变卡
    location /agent/ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # 关键：与 frpc 的 remotePort 一致
    location / { proxy_pass http://127.0.0.1:8080; }
}
