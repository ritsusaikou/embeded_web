# ============================================================
# 公网服务器 · frp 服务端配置
# 部署：/etc/frp/frps.toml
# 服务：systemctl enable --now frps
#
# 关键：proxyBindAddr 必须绑本机。
# 否则映射出来的 8080 会对公网开放，任何人都能绕过 Nginx
# 直连站点，甚至把服务当成跳板。
# ============================================================

bindPort = 7000

# 映射端口只监听本机，由 Nginx 反代过来
proxyBindAddr = "127.0.0.1"

auth.method = "token"
auth.token = "与 frpc.toml 保持一致"

# 只允许指定端口段，防止被注册到意外端口
allowPorts = [{ start = 8080, end = 8089 }]
